<!DOCTYPE html>
<!-- Source for static/og-image.png (1200x630). Regenerate: see README.md. -->
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
        background: #c8b89a;
        background-image:
            linear-gradient(rgba(90,64,48,0.12) 1px, transparent 1px),
            linear-gradient(90deg, rgba(90,64,48,0.12) 1px, transparent 1px);
        background-size: 40px 40px;
        display: flex; align-items: center; justify-content: center;
        font-family: 'Press Start 2P', monospace;
    }
    .card {
        width: 980px; background: #e8dcc8;
        border: 6px solid #5a4030; box-shadow: 14px 14px 0 #8a7060;
    }
    .bar {
        background: #5a4030; color: #f8f4ee; font-size: 18px;
        padding: 14px 22px;
    }
    .inner { display: flex; align-items: center; gap: 48px; padding: 44px 56px 48px; }
    .art { width: 260px; height: 260px; flex-shrink: 0; background: #fff; border: 5px solid #5a4030; }
    h1 { font-family: 'VT323', monospace; font-size: 112px; line-height: 0.9; margin: 0; color: #1a1008; letter-spacing: 4px; }
    p  { font-size: 17px; line-height: 1.7; color: #3d2b1a; margin: 26px 0 0; text-transform: uppercase; }
    .url { font-size: 14px; color: #6b5040; margin-top: 30px; }
</style>
</head>
<body>
    <div class="card">
        <div class="bar">■ Paint Together</div>
        <div class="inner">
            <svg class="art" viewBox="0 0 260 260">
                <path d="M30 190 C 70 60, 120 60, 140 140 S 210 220, 235 70" fill="none" stroke="#8b2020" stroke-width="14" stroke-linecap="round"/>
                <path d="M25 90 C 80 120, 120 30, 200 40" fill="none" stroke="#1a3a6b" stroke-width="10" stroke-linecap="round"/>
                <path d="M60 230 C 110 200, 170 240, 230 205" fill="none" stroke="#1a5c2a" stroke-width="12" stroke-linecap="round"/>
                <path d="M150 150 l0 26 l7 -7 l6 13 l5 -2 l-6 -13 l10 0 z" fill="#1a1008"/>
                <path d="M70 120 l0 26 l7 -7 l6 13 l5 -2 l-6 -13 l10 0 z" fill="#8b2020"/>
            </svg>
            <div>
                <h1>PAINT<br>TOGETHER</h1>
                <p>Draw together<br>in real time</p>
                <div class="url">Create a room · share the link · draw</div>
            </div>
        </div>
    </div>
</body>
</html>
